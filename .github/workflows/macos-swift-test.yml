name: macOS Swift XCTest & Unsigned iOS IPA Build (Liquid Analyzer)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  macos-m3b-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record macOS & Swift toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run controlled swift test suite
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift_test_output.txt

      - name: Generate Xcode project & build unsigned iOS IPA for Windows Sideloading
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild \
            -project LiquidAnalyzer.xcodeproj \
            -scheme LiquidAnalyzer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build

          mkdir -p build/ipa_stage/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LiquidAnalyzer.app build/ipa_stage/Payload/
          (cd build/ipa_stage && zip -qry ../../LiquidAnalyzer_M3B_v0.2.0.ipa Payload)
          shasum -a 256 LiquidAnalyzer_M3B_v0.2.0.ipa | tee LiquidAnalyzer_M3B_v0.2.0.ipa.sha256.txt

      - name: Upload macOS XCTest output & installable iOS IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiquidAnalyzer-M3B-macOS-Evidence-and-IPA-${{ matrix.os }}
          path: |
            swift_test_output.txt
            LiquidAnalyzer_M3B_v0.2.0.ipa
            LiquidAnalyzer_M3B_v0.2.0.ipa.sha256.txt
