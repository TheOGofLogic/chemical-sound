name: macOS Swift XCTest & Unsigned iOS IPA Build (No-Mac Windows Workflow)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  macos-m3b-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record macOS & Swift toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify handoff archive SHA-256 & run controlled swift test suite
        run: |
          set -euo pipefail
          cp dist/ChemicalSound_M3B_Mac_Handoff_v1.0.zip ./ChemicalSound_M3B_Mac_Handoff_v1.0.zip
          shasum -a 256 ChemicalSound_M3B_Mac_Handoff_v1.0.zip | tee ChemicalSound_M3B_Mac_Handoff_v1.0.sha256.txt
          unzip -q ChemicalSound_M3B_Mac_Handoff_v1.0.zip
          cd ChemicalSound_M3B_Mac_Handoff_v1.0
          swift test 2>&1 | tee ../swift_test_output.txt

      - name: Generate Xcode project & build unsigned iOS IPA for Windows Sideloading
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild \
            -project ChemicalSound.xcodeproj \
            -scheme ChemicalSound \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build

          mkdir -p build/ipa_stage/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ChemicalSound.app build/ipa_stage/Payload/
          (cd build/ipa_stage && zip -qry ../../ChemicalSound_M3B_v1.0.ipa Payload)
          shasum -a 256 ChemicalSound_M3B_v1.0.ipa | tee ChemicalSound_M3B_v1.0.ipa.sha256.txt

      - name: Upload macOS XCTest output & installable iOS IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChemicalSound-M3B-macOS-Evidence-and-IPA-${{ matrix.os }}
          path: |
            ChemicalSound_M3B_Mac_Handoff_v1.0.sha256.txt
            swift_test_output.txt
            ChemicalSound_M3B_v1.0.ipa
            ChemicalSound_M3B_v1.0.ipa.sha256.txt
