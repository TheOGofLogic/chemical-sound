name: Build Signed Android AAB & Upload to Google Play (Liquid Analyzer)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Integer versionCode for Google Play"
        required: true
        default: "5"
      track:
        description: "Google Play track (internal, closed, or production)"
        required: true
        default: "internal"

jobs:
  build-and-upload-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure Android SDK Licenses Accepted
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare or Generate Permanent Upload Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          EFFECTIVE_ALIAS="${KEY_ALIAS:-liquidanalyzer}"
          if [ -n "$PLAY_SA_JSON" ]; then
            echo "has_play_sa=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_sa=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            EFFECTIVE_KS_PASS="$KS_PASS"
            EFFECTIVE_KEY_PASS="${KEY_PASS:-$KS_PASS}"
            echo "generated_new_keystore=false" >> "$GITHUB_OUTPUT"
          else
            EFFECTIVE_KS_PASS="${KS_PASS:-$(openssl rand -hex 12)}"
            echo "::add-mask::$EFFECTIVE_KS_PASS"
            EFFECTIVE_KEY_PASS="${KEY_PASS:-$EFFECTIVE_KS_PASS}"
            echo "::add-mask::$EFFECTIVE_KEY_PASS"

            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$EFFECTIVE_ALIAS" \
              -storepass "$EFFECTIVE_KS_PASS" \
              -keypass "$EFFECTIVE_KEY_PASS" \
              -dname "CN=Liquid Analyzer, O=LiquidAnalyzer, C=US"

            mkdir -p "$RUNNER_TEMP/keystore_backup"
            cp "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/keystore_backup/liquidanalyzer-upload.jks"
            base64 -w 0 "$RUNNER_TEMP/upload-keystore.jks" > "$RUNNER_TEMP/keystore_backup/ANDROID_KEYSTORE_BASE64.txt"
            echo "generated_new_keystore=true" >> "$GITHUB_OUTPUT"
          fi

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "EFFECTIVE_KS_PASS=$EFFECTIVE_KS_PASS" >> "$GITHUB_ENV"
          echo "EFFECTIVE_KEY_ALIAS=$EFFECTIVE_ALIAS" >> "$GITHUB_ENV"
          echo "EFFECTIVE_KEY_PASS=$EFFECTIVE_KEY_PASS" >> "$GITHUB_ENV"

      - name: Save Generated Keystore Backup (First Run Only)
        if: steps.keystore.outputs.generated_new_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-LIQUID-ANALYZER-KEYSTORE-BACKUP
          path: ${{ runner.temp }}/keystore_backup/*
          retention-days: 14

      - name: Build Signed Release Android App Bundle (.aab)
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || '5' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.EFFECTIVE_KS_PASS }}
          ANDROID_KEY_ALIAS: ${{ env.EFFECTIVE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASS }}
        run: |
          gradle bundleRelease --no-daemon

      - name: Upload Signed .aab Artifact for Google Play Console
        uses: actions/upload-artifact@v4
        with:
          name: LiquidAnalyzer-Signed-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload directly to Google Play Console (Optional Service Account)
        if: steps.keystore.outputs.has_play_sa == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.liquidanalyzer.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
