[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-sound"
version = "0.1.1"
description = "Chemical Sound Phase 1 (v1.1) Reference Waveform, ESS Deconvolution, Acoustic Feature & Open-Set Classification Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
scipy = [
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
chemical-sound = "chemical_sound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
