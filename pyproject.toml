[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-analyzer"
version = "0.2.0"
description = "Liquid Analyzer Phase 1 (v1.2) Reference Waveform, ESS Deconvolution, Acoustic Feature & Open-Set Reference-Matching Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
scipy = [
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
liquid-analyzer = "liquid_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
