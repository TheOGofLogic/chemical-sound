name: ChemicalSound
options:
  bundleIdPrefix: org.chemicalsound
  deploymentTarget:
    iOS: "17.0"
targets:
  ChemicalSound:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChemicalSound
        excludes:
          - Info.plist
      - path: Assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.chemicalsound.acquisition
        PRODUCT_NAME: ChemicalSound
        INFOPLIST_FILE: ChemicalSound/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
