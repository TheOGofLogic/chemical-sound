name: LiquidAnalyzer
options:
  bundleIdPrefix: org.chemicalsound
  deploymentTarget:
    iOS: "17.0"
targets:
  LiquidAnalyzer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiquidAnalyzer
        excludes:
          - Info.plist
      - path: Assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.chemicalsound.acquisition
        PRODUCT_NAME: LiquidAnalyzer
        DEVELOPMENT_TEAM: M9Z3LR6VA2
        INFOPLIST_FILE: LiquidAnalyzer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
