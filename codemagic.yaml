workflows:
  chemical-sound-testflight:
    name: Chemical Sound M3B — Signed TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: ChemicalSoundASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.chemicalsound.acquisition
      vars:
        XCODE_PROJECT: "ChemicalSound.xcodeproj"
        XCODE_SCHEME: "ChemicalSound"
    scripts:
      - name: Run controlled Swift XCTest verification gate
        script: |
          set -euo pipefail
          swift test 2>&1 | tee swift_test_output.txt

      - name: Generate Xcode project & apply Apple code-signing profiles
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          xcode-project use-profiles

      - name: Build signed TestFlight IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - swift_test_output.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  chemical-sound-m3b-macos:
    name: Chemical Sound M3B — macOS XCTest & Unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Record macOS & Xcode toolchain versions
        script: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify handoff archive SHA-256 & run controlled swift test suite
        script: |
          set -euo pipefail
          cp dist/ChemicalSound_M3B_Mac_Handoff_v1.0.zip ./ChemicalSound_M3B_Mac_Handoff_v1.0.zip
          shasum -a 256 ChemicalSound_M3B_Mac_Handoff_v1.0.zip | tee ChemicalSound_M3B_Mac_Handoff_v1.0.sha256.txt
          unzip -q ChemicalSound_M3B_Mac_Handoff_v1.0.zip
          cd ChemicalSound_M3B_Mac_Handoff_v1.0
          swift test 2>&1 | tee ../swift_test_output.txt

      - name: Generate Xcode project & build unsigned iOS IPA
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild \
            -project ChemicalSound.xcodeproj \
            -scheme ChemicalSound \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build

          mkdir -p build/ipa_stage/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ChemicalSound.app build/ipa_stage/Payload/
          (cd build/ipa_stage && zip -qry ../../ChemicalSound_M3B_v1.0.ipa Payload)
          shasum -a 256 ChemicalSound_M3B_v1.0.ipa | tee ChemicalSound_M3B_v1.0.ipa.sha256.txt

    artifacts:
      - ChemicalSound_M3B_Mac_Handoff_v1.0.sha256.txt
      - swift_test_output.txt
      - ChemicalSound_M3B_v1.0.ipa
      - ChemicalSound_M3B_v1.0.ipa.sha256.txt
