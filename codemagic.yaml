workflows:
  liquid-analyzer-testflight:
    name: Liquid Analyzer v0.5.0 — Multi-Modal Fusion & Comparator Release (Build 20)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: ChemicalSoundASC
    environment:
      xcode: "27.2"
      groups:
        - ios_creds
      vars:
        BUNDLE_ID: "org.chemicalsound.acquisition"
        XCODE_PROJECT: "LiquidAnalyzer.xcodeproj"
        XCODE_SCHEME: "LiquidAnalyzer"
    scripts:
      - name: Record pinned macOS, Xcode & Swift toolchain reproducibility manifest
        script: |
          set -euo pipefail
          {
            echo "=== LIQUID ANALYZER v0.5.0 (BUILD 20) TOOLCHAIN MANIFEST ==="
            sw_vers
            xcodebuild -version
            xcodebuild -showsdks | grep -E "iphoneos|macosx" || true
            swift --version
          } | tee toolchain_manifest.txt

      - name: Run controlled Swift XCTest verification gate
        script: |
          set -euo pipefail
          swift test 2>&1 | tee swift_test_output.txt

      - name: Generate Xcode project, create Apple signing files & apply profiles
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          keychain initialize
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/dist_cert_key.pem
          else
            openssl genrsa -out /tmp/dist_cert_key.pem 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/dist_cert_key.pem
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed TestFlight IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - toolchain_manifest.txt
      - swift_test_output.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  liquid-analyzer-m3b-macos:
    name: Liquid Analyzer v0.5.0 — macOS XCTest & Unsigned iOS IPA (Build 20)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "27.2"
    scripts:
      - name: Record macOS & Xcode toolchain versions
        script: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run controlled swift test suite
        script: |
          set -euo pipefail
          swift test 2>&1 | tee swift_test_output.txt

      - name: Generate Xcode project & build unsigned iOS IPA
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild \
            -project LiquidAnalyzer.xcodeproj \
            -scheme LiquidAnalyzer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build

          mkdir -p build/ipa_stage/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LiquidAnalyzer.app build/ipa_stage/Payload/
          (cd build/ipa_stage && zip -qry ../../LiquidAnalyzer_R2B_v0.4.0.ipa Payload)
          shasum -a 256 LiquidAnalyzer_R2B_v0.4.0.ipa | tee LiquidAnalyzer_R2B_v0.4.0.ipa.sha256.txt

    artifacts:
      - swift_test_output.txt
      - LiquidAnalyzer_R2B_v0.4.0.ipa
      - LiquidAnalyzer_R2B_v0.4.0.ipa.sha256.txt
